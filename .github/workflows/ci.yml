name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Installation/recovery cases keep running after 15 minutes on hosted Macs.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The full suite exercises macOS sandbox-exec, launchd and BSD recovery tools.
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --global @openai/codex@0.162.0-alpha.2 --no-audit --no-fund
      - run: CODEX_REAL="$(command -v codex)" npm run check:rust-protocol-fixtures
      # biome format + lint, the file-size ratchet and the dependency guard.
      # `CI` is set, so a stale scripts/size-baseline.json fails here instead of
      # being silently rewritten.
      - run: npm run check
      - run: npm run typecheck   # tsc --noEmit
      - run: npm run build       # tsc -> dist/
      # Every posture value of the pinned codex's schema is one src/posture.mts
      # maps (spec 5.6); a new enum value or SandboxPolicy field fails here.
      - run: CODEX_REAL="$(command -v codex)" npm run check:posture-schema
      # build + node --test with coverage; fails under the line floor in
      # package.json (Node 24 has stable node:sqlite and built-in coverage).
      - run: npm run test:coverage

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Global [[allowlists]] requires 8.25+; match the locally verified scanner.
          GITLEAKS_VERSION: 8.30.1

  cargo-test:
    name: cargo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --workspace
