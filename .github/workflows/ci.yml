name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # The lockfile is generated on macOS. `npm ci` installs from it exactly,
      # which is what we want on the macOS runner (the platform this ships on).
      - if: runner.os == 'macOS'
        run: npm ci --no-audit --no-fund
      # On Linux `npm ci` fails: the runtime SDK ships per-platform native
      # binaries as optionalDependencies and the macOS lockfile omits the Linux
      # ones, so the Linux job resolves them with `npm install` instead.
      - if: runner.os != 'macOS'
        run: npm install --no-audit --no-fund
      - run: npm install --global @openai/codex@0.142.3 --no-audit --no-fund
      - run: CODEX_REAL="$(command -v codex)" npm run check:rust-protocol-fixtures
      # biome format + lint, the file-size ratchet and the dependency guard.
      # `CI` is set, so a stale scripts/size-baseline.json fails here instead of
      # being silently rewritten.
      - run: npm run check
      - run: npm run typecheck   # tsc --noEmit
      - run: npm run build       # tsc -> dist/
      # build + node --test with coverage; fails under the line floor in
      # package.json (Node 24 has stable node:sqlite and built-in coverage).
      - run: npm run test:coverage

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cargo-test:
    name: cargo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --workspace
